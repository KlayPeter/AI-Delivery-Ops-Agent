apiVersion: v1
kind: Service
metadata:
  name: delivery-ops-backend
  namespace: delivery-ops
  labels:
    app.kubernetes.io/name: delivery-ops-agent
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: delivery-ops-agent
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-ops-frontend
  namespace: delivery-ops
  labels:
    app.kubernetes.io/name: delivery-ops-agent
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: delivery-ops-agent
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32090
      protocol: TCP
