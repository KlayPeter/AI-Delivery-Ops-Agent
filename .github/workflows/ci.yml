name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx prisma validate
      - run: bun run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned local document converter
        run: |
          python -m venv .data/markitdown
          .data/markitdown/bin/python -m pip install -r src/connectors/markitdown/requirements.txt
      - name: Test with an isolated SQLite database
        shell: bash
        run: |
          TEST_DATABASE_PATH="$(mktemp)"
          DATABASE_URL="file:${TEST_DATABASE_PATH}" bunx prisma db push --skip-generate
          DATABASE_URL="file:${TEST_DATABASE_PATH}" bun test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: bun test
      - run: pnpm build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose -f docker/docker-compose.yml config
      - name: Build backend image
        run: docker build -f docker/server/Dockerfile.k8s -t delivery-ops-backend:ci backend
      - name: Build frontend image
        run: docker build -f docker/web/Dockerfile.k8s -t delivery-ops-frontend:ci .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
